<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTRLPLAY Club</title>
  <meta name="description" content="All official CTRLPLAY Club links in one place." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090f;
      --card: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.12);
      --text: #fff;
      --muted: #aaa9b7;
      --accent: #9b5cff;
      --accent2: #ff4fd8;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(155,92,255,.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255,79,216,.15), transparent 28%),
        var(--bg);
      display: flex;
      justify-content: center;
      padding: 45px 18px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(155,92,255,.12);
      filter: blur(90px);
      pointer-events: none;
    }

    .profile {
      margin-bottom: 28px;
      animation: fadeUp .7s ease both;
    }

    .logo {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #8c4dff, #ff4fd8);
      box-shadow: 0 12px 45px rgba(155,92,255,.35);
    }

    h1 {
      font-size: 31px;
      letter-spacing: -1px;
      margin-bottom: 7px;
    }

    .handle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 12px;
    }

    .bio {
      color: #d4d2dc;
      font-size: 14px;
      line-height: 1.6;
      max-width: 390px;
      margin: auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      position: relative;
      min-height: 65px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 15px;
      color: white;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(16px);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      animation: fadeUp .65s ease both;
    }

    .link:hover {
      transform: translateY(-3px) scale(1.01);
      background: rgba(255,255,255,.11);
      border-color: rgba(255,255,255,.25);
    }

    .icon {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      background: rgba(255,255,255,.1);
    }

    .link span:nth-child(2) {
      flex: 1;
      text-align: left;
      font-weight: 650;
      font-size: 15px;
    }

    .arrow {
      color: #85838e;
      font-size: 20px;
      transition: transform .2s ease;
    }

    .link:hover .arrow { transform: translateX(4px); }

    .instagram .icon { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
    .tiktok .icon { background: #111; border: 1px solid #444; }
    .x .icon { background: #000; border: 1px solid #444; }
    .linkedin .icon { background: #0a66c2; }
    .snapchat .icon { background: #fffc00; color: #111; }

    footer {
      margin-top: 28px;
      color: #666572;
      font-size: 12px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .link:nth-child(1) { animation-delay: .08s; }
    .link:nth-child(2) { animation-delay: .14s; }
    .link:nth-child(3) { animation-delay: .20s; }
    .link:nth-child(4) { animation-delay: .26s; }
    .link:nth-child(5) { animation-delay: .32s; }

    @media (max-width: 480px) {
      body { padding-top: 30px; }
      h1 { font-size: 28px; }
      .link { min-height: 62px; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="container">
    <section class="profile">
      <div class="logo">CTRL</div>
      <h1>CTRLPLAY Club</h1>
      <p class="handle">@ctrlplay.club</p>
      <p class="bio">
        Retro games • Game development • Creative arcade experiences
        <br />Press a link below and join the play.
      </p>
    </section>

    <section class="links">
      <a class="link instagram"
         href="https://www.instagram.com/ctrlplay.club?stkn=MXg2bGF3eXhneWlwaw%3D%3D&utm_source=qr"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">IG</span>
        <span>Instagram</span>
        <span class="arrow">›</span>
      </a>

      <a class="link tiktok"
         href="https://www.tiktok.com/@ctrlplay.club?_r=1&_t=ZS-99YdvaKboWn"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">♪</span>
        <span>TikTok</span>
        <span class="arrow">›</span>
      </a>

      <a class="link x"
         href="https://x.com/ctrlplay_club?s=11&t=KXqDCYbeQOuC1feZ3sPVIA"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">𝕏</span>
        <span>X / Twitter</span>
        <span class="arrow">›</span>
      </a>

      <a class="link linkedin"
         href="https://www.linkedin.com/in/ctrlplay-club-173234435"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">in</span>
        <span>LinkedIn</span>
        <span class="arrow">›</span>
      </a>

      <a class="link snapchat"
         href="https://snapchat.com/t/eIPraf5f"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">👻</span>
        <span>Snapchat</span>
        <span class="arrow">›</span>
      </a>
    </section>

    <footer>CTRLPLAY Club © 2026</footer>
  </main>
</body>
</html>
